name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Production dependency security audit
        run: npm audit --omit=dev --package-lock-only --audit-level=high

  deploy:
    name: Deploy to ARM64 Host
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/xsypher
            git fetch origin main
            git reset --hard origin/main
            # Load user profile/NVM to ensure 'node' and 'npm' are in PATH during non-interactive SSH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            source ~/.profile || true
            source ~/.bashrc || true
            
            # Run idempotent schema migrations
            npm install --production=false
            node migrate.mjs
            
            # Rebuild and restart containers
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            
            # Prune dangling images to conserve disk space
            docker image prune -f
