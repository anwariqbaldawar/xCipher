name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to ARM64 Host
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/apps/xsypher
            git pull origin main
            
            # Run Drizzle ORM migrations
            # If using migrate.mjs:
            node migrate.mjs || true
            
            # Rebuild and restart the container zero-downtime
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            
            # Prune dangling images to conserve disk space
            docker image prune -f
