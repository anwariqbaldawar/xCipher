# ─────────────────────────────────────────────────────────────────────────────
# xSypher — Security header hardening (Caddy layer defense-in-depth)
# Finding: SEC-002/SEC-005 | Origin: docs/Caddyfile.example par yeh blocks add karein
# Note: middleware.ts pehle se HSTS/XFO/XCTO/Referrer/Permissions set karta hai —
# yeh layer unhein double-lock karti hai (proxy-level, app crash hone par bhi).
# Reload: sudo systemctl reload caddy
# ─────────────────────────────────────────────────────────────────────────────

xsypher.com {
    encode zstd gzip

    header {
        # Middleware se match karte hain (defence-in-depth)
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()"

        # App response ko khatam karke yeh nahi lagate — sirf missing hone par default:
        # (Caddy header: ka `deferred` behaviour samajh lo; agar conflict aaye to
        #  sirf HSTS rakhein, baaki middleware kaafi hain.)
        # X-Robots-Tag "index, follow"   # default — admin/preview host par alag hai

        # Optional hardening (tabhi jab embeds/serviceworker confirm ho):
        # Cross-Origin-Opener-Policy "same-origin"
        # Cross-Origin-Resource-Policy "same-site"
    }

    reverse_proxy 127.0.0.1:3000 {
        header_up Host {host}
        header_up X-Forwarded-Proto {scheme}

        # NOTE (BE-007): /api/health 503 = "degraded" (Redis down bhi 503 deta hai)
        # to Caddy poora site 502 kar sakta hai — Redis outage = full site outage.
        # Fix option: health_uri ko sirf app-liveness (200 chahe degraded ho) rakhein
        # ya Caddy health_pool failures mein non-2xx ko bhi tolerate karein.
        health_uri /api/health
        health_interval 30s
        health_timeout 5s
    }
}

